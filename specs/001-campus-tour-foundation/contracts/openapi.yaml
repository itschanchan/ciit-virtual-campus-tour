openapi: 3.1.0
info:
  title: CIIT Virtual Campus Tour API
  version: 1.0.0
  description: |
    Backend contract for the foundation phase. Tour catalog content is bundled with the
    frontend; the backend currently exposes health and status only.
servers:
  - url: http://localhost:5000
    description: Local development
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Report service health
      description: |
        Returns the service status and current server time. The frontend may call this
        endpoint for an optional status indicator but MUST NOT block tour content on it.
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Service is running but a required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
          enum:
            - ok
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 server timestamp.
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
              examples:
                - SERVICE_UNAVAILABLE
                - NOT_FOUND
            message:
              type: string
              description: Visitor-safe message that does not expose internals.
